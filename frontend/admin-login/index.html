<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Login | Skincare With Happy</title><link rel="stylesheet" href="/styles.css"><style>
.admin-login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#fff7f9,#f8fafc)}
.admin-login-card{width:min(460px,100%);background:#fff;border:1px solid #f0dfe5;border-radius:24px;padding:30px;box-shadow:0 20px 60px rgba(88,24,49,.12)}
.admin-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.admin-brand img{width:52px;height:52px;border-radius:14px;object-fit:cover}.admin-brand strong{display:block;color:#5d1734;font-size:1.05rem}.admin-brand span{display:block;color:#a05a75;font-size:.78rem;margin-top:3px}
.admin-form{display:grid;gap:14px}.admin-form label{font-weight:800;color:#34252b;font-size:.86rem}.admin-form input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #ead7de;border-radius:11px;font:inherit}.password-field{position:relative}.password-field input{padding-right:48px}.password-toggle{position:absolute;right:9px;top:50%;transform:translateY(-50%);border:0;background:transparent;padding:5px;cursor:pointer;font-size:16px}.admin-note{color:#78666f;line-height:1.55;font-size:.9rem}.admin-message{min-height:20px;font-weight:700}.admin-message.error{color:#b42318}.admin-message.success{color:#16794c}.admin-back{display:inline-block;margin-top:18px;color:#5d1734;font-weight:800;text-decoration:none}
</style></head><body><main class="admin-login"><section class="admin-login-card"><div class="admin-brand"><img src="/images/logo.png" alt="Skincare With Happy"><div><strong>Skincare With Happy</strong><span>Private Administrator Login</span></div></div><h1>Admin Dashboard</h1><p class="admin-note">Sign in with the administrator email and password first. You will then complete the secure calculator/PIN verification before the private Admin Dashboard is unlocked.</p><form id="adminLoginForm" class="admin-form"><div><label for="adminEmail">Administrator email</label><input id="adminEmail" type="email" autocomplete="username" required placeholder="Admin email"></div><div><label for="adminPassword">Administrator password</label><div class="password-field"><input id="adminPassword" type="password" autocomplete="current-password" required placeholder="Admin password"><button class="password-toggle" type="button" onclick="togglePassword(this)" aria-label="Show password">👁</button></div></div><button class="btn" type="submit">Sign In to Admin Dashboard</button><div id="adminMessage" class="admin-message"></div></form><a class="admin-back" href="/">← Back to store</a></section></main><script src="/app.js"></script><script src="/auth.js"></script><script>
function togglePassword(button){const input=document.getElementById('adminPassword');const show=input.type==='password';input.type=show?'text':'password';button.textContent=show?'🙈':'👁';button.setAttribute('aria-label',show?'Hide password':'Show password');}
document.getElementById('adminLoginForm').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('adminMessage');msg.className='admin-message';msg.textContent='Signing in...';try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:document.getElementById('adminEmail').value.trim(),password:document.getElementById('adminPassword').value})});if(!d?.pendingToken||d.user?.role!=='admin')throw new Error('Administrator access is not available for this account.');savePending(d);msg.className='admin-message success';msg.textContent='Credentials accepted. Opening secure PIN gateway...';location.href='/admin/calculator/';}catch(x){msg.className='admin-message error';msg.textContent=x.message||'Unable to sign in.';}};
</script></body></html>
