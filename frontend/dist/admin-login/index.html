<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex,nofollow"><title>Admin Calculator | Skincare With Happy</title><link rel="stylesheet" href="/styles.css"><style>
body{margin:0;font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at top,#ffe4ec 0,#fff8f3 42%,#f7edf1 100%);min-height:100vh;color:#171018}.calc-access{min-height:100vh;display:grid;place-items:center;padding:24px}.calc-panel{width:min(520px,100%);background:linear-gradient(180deg,#102f62,#081d3f);color:#fff;border-radius:30px;padding:22px;box-shadow:0 24px 70px rgba(28,18,42,.22)}.brand-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px}.brand-row img{width:48px;height:48px;border-radius:14px;object-fit:cover;background:#fff}.brand-row b{display:block;font-size:1rem;letter-spacing:.08em}.brand-row small{display:block;color:#8beaff;font-size:.68rem;letter-spacing:.2em;margin-top:3px}.display{height:82px;border-radius:18px;background:#050d1a;border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:flex-end;font-size:36px;font-weight:900;padding:0 18px;margin:12px 0 14px;letter-spacing:.1em}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.key{border:0;border-radius:14px;min-height:56px;font-size:19px;font-weight:900;cursor:pointer;background:#f8fafc;color:#111827}.key.action{background:#19b7d2;color:#052034}.key.zero{grid-column:span 2}.status{min-height:24px;margin:13px 0 6px;font-weight:800;font-size:.86rem;text-align:center}.status.error{color:#fecdd3}.status.success{color:#bbf7d0}.pin-actions{display:flex;gap:9px;margin-top:10px}.pin-actions button{flex:1;border:0;border-radius:13px;padding:13px 12px;font-weight:900;cursor:pointer}.primary{background:#19b7d2;color:#052034}.light{background:#e5e7eb;color:#111827}.hint{text-align:center;color:#cbd5e1;font-size:.8rem;line-height:1.55;margin:14px 4px 0}.back{display:block;text-align:center;margin-top:16px;color:#fff;font-weight:800;text-decoration:none}@media(max-width:560px){.calc-access{padding:12px}.calc-panel{padding:16px;border-radius:24px}.key{min-height:52px}.display{height:70px;font-size:30px}}
</style></head><body><main class="calc-access"><section class="calc-panel"><div class="brand-row"><img src="/images/logo.png" alt="Skincare With Happy"><div><b>SKINCARE WITH HAPPY</b><small>PRIVATE ADMIN ACCESS</small></div></div><div class="display" id="calcDisplay">PIN</div><div class="keys" id="calcKeys"><button class="key action" data-action="clear">C</button><button class="key action" data-action="back">DEL</button><button class="key action" data-action="blocked">÷</button><button class="key action" data-action="blocked">×</button><button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key action" data-action="blocked">−</button><button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key action" data-action="blocked">+</button><button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key action" data-action="equals">=</button><button class="key zero" data-value="0">0</button><button class="key" data-action="blocked">.</button><button class="key action" data-action="pin">PIN</button></div><div class="status" id="status">Enter your private 4–6 digit administrator PIN.</div><div class="pin-actions"><button class="primary" type="button" onclick="submitPin()">Enter PIN</button><button class="light" type="button" onclick="resetAccess()">Reset</button></div><p class="hint" id="hint">First-time setup: if the administrator PIN has not been created yet, the first valid 4–6 digit PIN entered here can be created and confirmed.</p><a class="back" href="/">← Back to store</a></section></main><script src="/app.js"></script><script src="/auth.js"></script><script>
let pin='',pending=false,setup=false,firstPin='';const display=document.getElementById('calcDisplay'),status=document.getElementById('status'),hint=document.getElementById('hint');
function render(){display.textContent=pin?'•'.repeat(pin.length):'PIN'}function append(v){if(pin.length>=6)return;pin+=v;render()}function clearPin(){pin='';render()}function back(){pin=pin.slice(0,-1);render()}
async function start(){try{const d=await api('/auth/admin-pin/start',{method:'POST'});savePending(d);pending=true;setup=Boolean(d.pinSetupRequired);status.textContent=setup?'Create your private 4–6 digit PIN.':'Enter your private 4–6 digit PIN.';hint.textContent=setup?'First setup: enter a 4–6 digit PIN, press PIN, then enter it again to confirm.':'Use the administrator PIN to open the private dashboard.'}catch(e){status.textContent=e.message;status.className='status error'}}
async function submitPin(){if(!pending){await start();if(!pending)return}if(!/^\d{4,6}$/.test(pin)){status.textContent='Enter a 4–6 digit PIN.';status.className='status error';return}try{if(setup&&!firstPin){firstPin=pin;clearPin();status.textContent='Confirm your new PIN.';status.className='status';return}if(setup&&pin!==firstPin){firstPin='';clearPin();status.textContent='PIN confirmation does not match. Try again.';status.className='status error';return}const d=setup?await api('/auth/pin/set-pending',{method:'POST',pending:true,body:JSON.stringify({pin:firstPin,pinConfirm:pin})}):await api('/auth/pin/verify',{method:'POST',pending:true,body:JSON.stringify({pin})});if(d.user?.role!=='admin')throw new Error('Admin access required.');saveSession(d);status.textContent='Access granted.';status.className='status success';setTimeout(()=>location.href='/admin-dashboard/',200)}catch(e){status.textContent=e.message;status.className='status error';clearPin()}}
function resetAccess(){clearPin();firstPin='';pending=false;setup=false;localStorage.removeItem('swh_pending_token');localStorage.removeItem('swh_pending_user');status.textContent='Enter your private 4–6 digit administrator PIN.';status.className='status';start()}
document.getElementById('calcKeys').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const v=b.dataset.value,a=b.dataset.action;if(v)append(v);else if(a==='clear')clearPin();else if(a==='back')back();else if(a==='equals'||a==='pin')submitPin();else if(a==='blocked'){status.textContent='Operators are disabled while entering the security PIN.';status.className='status error'}});start();
</script></body></html>
