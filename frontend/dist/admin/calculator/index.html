<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Security Gateway | Skincare With Happy</title>
<link rel="stylesheet" href="/styles.css">
<style>
.gateway-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#fff7f9,#f8fafc)}
.gateway-card{width:min(460px,100%);background:#fff;border:1px solid #f0dfe5;border-radius:24px;padding:30px;box-shadow:0 20px 60px rgba(88,24,49,.12)}
.gateway-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.gateway-brand img{width:52px;height:52px;border-radius:14px;object-fit:cover}.gateway-brand strong{display:block;color:#5d1734}.gateway-brand span{display:block;color:#8d6a76;font-size:.82rem;margin-top:3px}
.gateway-form{display:grid;gap:14px}.gateway-form input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ead7de;border-radius:11px;font:inherit}.gateway-pin{position:relative}.gateway-pin input{padding-right:48px}.gateway-pin button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;padding:6px;cursor:pointer}.gateway-message{min-height:22px;font-weight:700}.gateway-message.error{color:#b42318}.gateway-message.success{color:#16794c}.gateway-help{color:#78666f;line-height:1.55;font-size:.9rem}.gateway-link{color:#5d1734;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<main class="gateway-page"><section class="gateway-card">
<div class="gateway-brand"><img src="/images/logo.png" alt="Skincare With Happy"><div><strong>Skincare With Happy</strong><span>Private Administrator Security</span></div></div>
<span class="pill">Calculator / PIN Gateway</span><h1>Verify administrator access</h1>
<p class="gateway-help" id="gatewayHelp">Enter your private 4–6 digit administrator PIN to unlock the Admin Dashboard.</p>
<form id="gatewayForm" class="gateway-form"><div class="gateway-pin"><input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4,6}" minlength="4" maxlength="6" placeholder="Enter 4–6 digit PIN" required><button type="button" id="togglePin" aria-label="Show PIN">👁</button></div><div class="gateway-pin" id="confirmWrap" style="display:none"><input id="confirmPin" type="password" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6" placeholder="Confirm PIN"><button type="button" id="toggleConfirm" aria-label="Show PIN">👁</button></div><button class="btn" id="submitBtn" type="submit">Verify &amp; Open Admin Dashboard</button><div id="message" class="gateway-message"></div></form>
<p style="margin-top:18px"><a class="gateway-link" href="/admin-login/">← Return to Admin Login</a></p>
</section></main>
<script src="/app.js"></script><script src="/auth.js"></script><script>
const pin=document.getElementById('pin'),confirmPin=document.getElementById('confirmPin'),confirmWrap=document.getElementById('confirmWrap'),message=document.getElementById('message'),form=document.getElementById('gatewayForm'),submitBtn=document.getElementById('submitBtn'),toggle=document.getElementById('togglePin'),toggleConfirm=document.getElementById('toggleConfirm'),help=document.getElementById('gatewayHelp');
const pendingToken=getPendingToken();
const setup=localStorage.getItem('swh_pin_setup')==='1';
if(setup){help.textContent='Create a private 4–6 digit administrator PIN. You will use it after every administrator sign-in.';pin.placeholder='Create 4–6 digit PIN';confirmWrap.style.display='block';submitBtn.textContent='Create PIN & Open Admin Dashboard';confirmPin.required=true;}
function toggleInput(input,button){const show=input.type==='password';input.type=show?'text':'password';button.textContent=show?'🙈':'👁';button.setAttribute('aria-label',show?'Hide PIN':'Show PIN');}
toggle.onclick=()=>toggleInput(pin,toggle);toggleConfirm.onclick=()=>toggleInput(confirmPin,toggleConfirm);
if(!pendingToken){message.className='gateway-message error';message.textContent='Your secure administrator session has ended. Sign in again to continue.';submitBtn.disabled=true;}
form.onsubmit=async e=>{e.preventDefault();if(!pendingToken)return;message.className='gateway-message';message.textContent=setup?'Creating PIN...':'Verifying PIN...';try{let d;if(setup){d=await api('/auth/pin/set-pending',{method:'POST',pending:true,body:JSON.stringify({pin:pin.value,pinConfirm:confirmPin.value})});}else{d=await api('/auth/pin/verify',{method:'POST',pending:true,body:JSON.stringify({pin:pin.value})});}if(d?.user?.role!=='admin')throw new Error('Administrator access required.');saveSession(d);localStorage.removeItem('swh_pin_setup');sessionStorage.setItem('adminGatewayVerified','1');message.className='gateway-message success';message.textContent='Verification successful. Opening dashboard...';setTimeout(()=>location.href='/admin/',200);}catch(e){message.className='gateway-message error';message.textContent=e.message||'Unable to verify PIN.';}};
</script>
</body></html>
